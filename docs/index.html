<!DOCTYPE html>
<html lang="ja" class="fs-m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とけいクエスト</title>
<meta name="description" content="3年算数「時こくと時間」の練習アプリ。時計の針を動かして、時こく・時間・たんいのかんさんを練習できます。">
<meta name="theme-color" content="#c2510c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="とけいクエスト">
<style>
/* 色は3つだけ：オレンジ（すすむ）・こん（文字）・みどり（できた）。すべて文字と背景のコントラスト4.5以上 */
:root{
  --pri:#c2510c; --pri-d:#8f3a06; --pri-l:#fde8d7; --pri-t:#9a3f08;
  --ink:#1f2a44; --sub:#4a5470; --ok:#11724f; --ok-d:#0a4f36; --ok-l:#dff3ea; --ok-t:#0b5a3e;
  --cream:#fffaf3; --bg:#f6eee3; --line:#e6dccd; --mute:#efe9e1; --mute-t:#5d6478;
  --r:20px; --shadow:0 2px 0 rgba(31,42,68,.06),0 8px 24px rgba(31,42,68,.08);
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","ヒラギノ丸ゴ ProN","UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","BIZ UDPGothic","Kosugi Maru","M PLUS Rounded 1c","Zen Maru Gothic","Noto Sans JP","Yu Gothic UI",sans-serif;
}
html.fs-s{font-size:17px} html.fs-m{font-size:19px} html.fs-l{font-size:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.75;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere;line-break:strict;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 12% 0%,#fff6ea 0,transparent 45%),radial-gradient(circle at 100% 100%,#f1e4d2 0,transparent 40%);background-attachment:fixed}
button{font-family:inherit;color:inherit;letter-spacing:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:1100px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 40px}
.screen{display:none}
.screen.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hide{display:none!important}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* ===== はじめの画面 ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px;cursor:pointer;
  background:linear-gradient(180deg,#bfe0f6 0%,#e8f3fb 42%,#fff6ea 100%);transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sttl{font-size:clamp(40px,11vw,72px);font-weight:800;color:#fff;letter-spacing:.08em;line-height:1.1;text-align:center;
  text-shadow:0 3px 0 var(--pri-d),0 0 2px var(--pri-d),2px 2px 0 var(--pri-d),-2px 2px 0 var(--pri-d),2px -2px 0 var(--pri-d),-2px -2px 0 var(--pri-d),0 8px 18px rgba(143,58,6,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .ssub{font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:4px 16px;font-size:clamp(14px,3.8vw,18px)}
#splash .simg{width:min(92vw,62vh,640px);aspect-ratio:1/1;border-radius:28px;overflow:hidden;box-shadow:0 18px 40px rgba(31,42,68,.25);border:6px solid #fff;animation:zoom 3s ease-out both;background:#cfe6f5}
#splash .simg img{width:100%;height:100%;object-fit:cover;display:block}
#splash .stap{font-size:15px;color:var(--sub);font-weight:700}
#splash .sbar{width:min(60vw,260px);height:8px;border-radius:999px;background:rgba(31,42,68,.12);overflow:hidden}
#splash .sbar i{display:block;height:100%;width:0;background:var(--pri);border-radius:999px;animation:load var(--sd,2.6s) linear forwards}
@keyframes load{to{width:100%}}
@keyframes zoom{from{transform:scale(1.04)}to{transform:scale(1)}}
@media (orientation:landscape) and (max-height:520px){#splash{flex-direction:row;gap:24px}#splash .simg{width:min(70vh,46vw)}#splash .stxt{display:flex;flex-direction:column;align-items:center;gap:10px}}
.stxt{display:contents}

/* ===== 共通部品 ===== */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:none;border-radius:18px;padding:12px 18px;font-size:1.05rem;font-weight:800;color:#fff;cursor:pointer;margin:8px 0;text-align:center;line-height:1.35;
  background:var(--pri);box-shadow:0 5px 0 var(--pri-d);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)} .btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.dark{background:var(--ink);box-shadow:0 5px 0 #0d1324} .btn.dark:active{box-shadow:0 1px 0 #0d1324}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)} .btn.ghost:active{box-shadow:0 0 0 var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800;cursor:pointer;padding:0 10px;box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s;font-size:15px;line-height:1;white-space:nowrap}
.ibtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.ibtn svg{width:24px;height:24px}
.fsz{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 3px 0 var(--line);flex:none}
.fsz button{border:none;background:#fff;min-width:44px;height:44px;font-weight:800;cursor:pointer;padding:0 6px;color:var(--ink);line-height:1}
.fsz button+button{border-left:2px solid var(--line)}
.fsz button.on{background:var(--ink);color:#fff}
.fsz .a1{font-size:14px} .fsz .a2{font-size:17px} .fsz .a3{font-size:20px}

/* ===== ホーム ===== */
.head{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.logo{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.logo svg{width:40px;height:40px;flex:none}
.logo h1{margin:0;font-size:clamp(20px,5.9vw,30px);color:var(--pri-t);letter-spacing:.04em;white-space:nowrap;font-weight:800;line-height:1.2}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:#fff;border-radius:var(--r);padding:10px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 14px;font-weight:800;font-size:.92rem;line-height:1.6}
.status .num{font-weight:800}
.status .medals{white-space:nowrap;font-weight:700}
.note{background:#fff1d6;border:2px solid #f0c977;color:#7a3200;border-radius:16px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;font-weight:700}
.hero{background:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px;display:grid;grid-template-columns:1fr;gap:4px}
.hero .lbl{font-size:.85rem;color:var(--sub);font-weight:700}
.hero .ttl{font-size:1.35rem;font-weight:800;line-height:1.4}
.hero .bar{height:14px;background:var(--mute);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.hero .bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.hero .btn{min-height:70px;font-size:1.3rem;margin:10px 0 2px}
.sec{font-weight:800;font-size:min(1rem,19px);margin:0 0 8px;color:var(--ink);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{min-height:60px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1rem;cursor:pointer;line-height:1.25;padding:6px 4px;box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s}
.tab:active{transform:translateY(3px);box-shadow:none}
.tab small{display:block;font-size:.75rem;color:var(--sub);font-weight:700}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #0d1324}
.tab.on small{color:#dfe3ee}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;text-align:left;border:2px solid transparent;border-radius:var(--r);background:#fff;padding:14px;min-height:128px;cursor:pointer;box-shadow:0 4px 0 var(--line),0 6px 16px rgba(31,42,68,.06);display:flex;flex-direction:column;gap:2px;transition:transform .06s,box-shadow .06s}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.tile .ic{font-size:1.8rem;line-height:1.2}
.tile .t{font-weight:800;font-size:1rem;line-height:1.45}
.tile .d{font-size:.8rem;color:var(--sub);line-height:1.5}
.tile.got{background:var(--ok-l)} .tile.got .d{color:var(--ok-t)}
.tile.lock{background:var(--mute);box-shadow:none;color:var(--mute-t);cursor:default}
.tile.lock .d{color:var(--mute-t)}
.tile.now{border-color:var(--pri)}
.tile.now::after{content:"とちゅう";position:absolute;top:10px;right:10px;background:var(--pri);color:#fff;border-radius:999px;font-size:.7rem;padding:0 9px;font-weight:800;line-height:1.8}

/* ===== プレイ ===== */
.phead{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px;margin-bottom:12px}
.prow{display:flex;align-items:center;gap:8px}
.prow .st{flex:1;min-width:0;font-weight:800;font-size:min(.9rem,17px);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow2{display:flex;align-items:center;gap:10px;margin-top:6px}
.prog{display:flex;gap:4px;flex:1}
.prog i{flex:1;height:12px;border-radius:999px;background:var(--mute);transition:background .2s}
.prog i.done{background:var(--ok)}
.prog i.cur{background:var(--pri-l);box-shadow:inset 0 0 0 2px var(--pri)}
.pmeta{flex:none;font-weight:800;font-size:.85rem;white-space:nowrap}
.combo{display:inline-block;background:var(--pri);color:#fff;border-radius:999px;padding:0 10px;font-size:.8rem}
.qtext{font-size:1.25rem;font-weight:800;text-align:center;margin:2px 0 10px;line-height:1.6}
.qtext.big{font-size:1.75rem;letter-spacing:.06em;margin:12px 0}
.ref{background:var(--pri-l);color:var(--pri-t);border-radius:16px;padding:8px 12px;text-align:center;font-weight:800;margin-bottom:6px;font-size:.95rem}
.pgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:860px){.pgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stage{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:14px}
.clockbox{display:flex;justify-content:center}
.clock{width:min(76vw,38vh,320px);height:auto;touch-action:none;-webkit-user-select:none;user-select:none;display:block}
@media (min-width:860px){.clock{width:min(38vw,50vh,360px)}}
.clock.drag{cursor:grab}
.dragtip{text-align:center;font-size:.8rem;color:var(--sub);margin-top:2px}
.nowtime{text-align:center;font-weight:800;font-size:1.1rem;margin:4px 0 0}
.nowtime b{color:var(--pri-t);font-size:1.45rem}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clocks .clock{width:100%;max-width:230px}
.clocks>div{display:flex;flex-direction:column;align-items:center}
.clab{font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 14px;margin-bottom:6px;font-size:.85rem;line-height:1.8}
.panel{background:#fff;border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.fields{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 14px;margin:2px 0 12px}
.field{display:flex;align-items:center;gap:6px;cursor:pointer;border:none;background:none;padding:0}
.field .box{min-width:84px;height:64px;border-radius:16px;border:3px solid var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;padding:0 8px;transition:border-color .15s,box-shadow .15s}
.field.active .box{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l);background:#fff}
.field .unit{font-size:1.15rem;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:60px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:800;cursor:pointer;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s;color:var(--ink)}
.key:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.key.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 0 var(--ok-d);font-size:min(1.1rem,19px);white-space:nowrap}
.key.ok:active{box-shadow:0 0 0 var(--ok-d)}
.key.sm{font-size:min(.95rem,17px);white-space:nowrap}
.movebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.movebtns .key{font-size:1.05rem;min-height:56px}
.movebtns .p{background:var(--pri-l);border-color:#f6cfae;box-shadow:0 4px 0 #f0c29c;color:var(--pri-t)}
.kbtip{font-size:.75rem;color:var(--sub);text-align:center;margin-top:8px;line-height:1.5}
@media (hover:none){.kbtip{display:none}}
.fb{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:40;max-width:calc(100vw - 32px);width:max-content;text-align:center;font-size:1.2rem;font-weight:800;padding:10px 24px;border-radius:999px;background:#fff;box-shadow:0 10px 28px rgba(31,42,68,.22);pointer-events:none;line-height:1.5}
.fb:empty{display:none}
.fb.good{color:#fff;background:var(--ok);animation:bump .35s cubic-bezier(.2,1.6,.4,1)}
.fb.miss{color:#7a3200;background:#fff1d6;border:3px solid #f0c977;animation:bump .3s ease-out}
@keyframes bump{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.yay{animation:yay .45s ease-out}
@keyframes yay{0%{box-shadow:0 0 0 0 rgba(17,114,79,.55)}100%{box-shadow:0 0 0 18px rgba(17,114,79,0)}}
.hintbtn{background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.hintbtn:active{box-shadow:0 1px 0 var(--ink)}
.hintbtn.pulse{background:#fff1d6;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(240,201,119,.9)}50%{outline:8px solid rgba(240,201,119,.0)}}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hintbox{background:var(--cream);border:3px solid #f0c977;border-radius:26px;padding:14px}
.hintbox h3{margin:0 0 6px;font-size:1.05rem;color:#7a3200}
.hline{font-size:1.1rem;font-weight:800;margin:4px 0 10px;line-height:2.4}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:50px;border-radius:14px;border:3px dashed #d39a2e;background:#fff;vertical-align:middle;margin:0 4px;font-size:1.35rem;font-weight:800;cursor:pointer;padding:0 6px;line-height:1}
.blank.active{border-style:solid;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l)}
.blank.ok{border-style:solid;border-color:var(--ok);background:var(--ok-l);color:var(--ok-t);cursor:default}
.hmsg{text-align:center;font-weight:800;margin:6px 0 10px;color:#7a3200;min-height:1.6em}
.hans{text-align:center;font-size:1.35rem;font-weight:800;color:var(--ok-t)}

/* ===== クリア ===== */
.clear{text-align:center;padding:22px 16px;background:#fff;border-radius:28px;box-shadow:var(--shadow);max-width:620px;margin:10px auto}
.clear .medal{font-size:5.5rem;line-height:1.1;margin:4px 0;display:inline-block;animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.clear h2{font-size:1.7rem;margin:2px 0 6px;color:var(--pri-t);font-weight:800}
.clear .msg{font-size:1.1rem;font-weight:800}
.clear .newt{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;border-radius:16px;padding:6px 16px;font-weight:800}
.clear .btns{max-width:460px;margin:16px auto 0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.5s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(420deg)}}

/* ===== せってい ===== */
.set .phead h2{margin:0;font-size:1.1rem;flex:1}
.sitem{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sitem .sl{font-weight:800;margin-bottom:8px}
.sitem .sd{font-size:.82rem;color:var(--sub);margin-top:6px;line-height:1.6}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 90px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.95rem;cursor:pointer;padding:4px 8px;box-shadow:0 3px 0 var(--line);line-height:1.3}
.seg button:active{transform:translateY(3px);box-shadow:none}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 3px 0 #0d1324}
.setgrid{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:860px){.setgrid{grid-template-columns:1fr 1fr}}
.howto ol{padding-left:1.3em;margin:4px 0;line-height:1.7} .howto li{margin:4px 0}

/* ===== モーダル・トースト ===== */
#modal{position:fixed;inset:0;background:rgba(31,42,68,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mcard{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.28);animation:pop .22s ease-out}
.mcard h2{font-size:1.2rem;margin:2px 0 10px}
.mcard p,.mcard ol{margin:6px 0 12px;text-align:left;line-height:1.7}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<!-- はじめの画面（絵は 画像生成で作った手描き風のもの。文字はHTMLで重ねている） -->

    <div class="setgrid" id="setList"></div>
  </section>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="mcard" id="mcard"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/*==================== 保存（この端末だけ） ====================*/
var KEY = 'tokeiQuest.v1';
var canStore = (function(){ try{ var k='__tq_test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
var DEF_SET = { unlock:'order', count:10, autoHint:true, sound:true, font:'m', motion:'auto' };
var DB = loadDB();
function freshDB(){ return { v:1, score:0, medals:{}, best:{}, resume:null, last:null, set:copy(DEF_SET) }; }
function copy(o){ return JSON.parse(JSON.stringify(o)); }
function loadDB(){
  var d = null;
  try{ var s = localStorage.getItem(KEY); if(s) d = JSON.parse(s); }catch(e){ d = null; }
  if(!d || typeof d !== 'object') d = freshDB();
  var f = freshDB();
  for(var k in f){ if(!(k in d)) d[k] = f[k]; }
  for(var k2 in DEF_SET){ if(!(k2 in d.set)) d.set[k2] = DEF_SET[k2]; }
  if(!d.medals || typeof d.medals!=='object') d.medals = {};
  d.score = parseInt(d.score,10) || 0;
  if('pin' in d){ delete d.pin; d._cleaned=true; }
  return d;
}
function saveDB(){ if(!canStore) return; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/*==================== ステップ ====================*/
var COURSES = [
  {id:'A', name:'時こく',     long:'時こくを もとめる', steps:['A1','A2','A3','A4','A5']},
  {id:'B', name:'たんい',     long:'たんいの かんさん', steps:['B1','B2','B3','B4']},
  {id:'C', name:'時間',       long:'時間を もとめる',   steps:['C1','C2','C3','C4']}
];
var ALL = ['A1','A2','A3','A4','A5','B1','B2','B3','B4','C1','C2','C3','C4'];
var INFO = {
  A1:{t:'とけいを よもう',          d:'いま 何時何分？'},
  A2:{t:'〇分 すすめよう',           d:'時は かわらない'},
  A3:{t:'〇分 すすめよう（またぐ）', d:'ちょうどの時を こえる'},
  A4:{t:'〇時間〇分 すすめよう',     d:'分は くり上がらない'},
  A5:{t:'〇時間〇分 すすめよう（くり上がり）', d:'60分で 1時間 ふえる'},
  B1:{t:'たんいを おぼえよう',       d:'1日・1時間・1分'},
  B2:{t:'大きい → 小さい',          d:'時間を 分に など'},
  B3:{t:'小さい → 大きい',          d:'分を 時間に など'},
  B4:{t:'びょうの かんさん',         d:'分と びょう'},
  C1:{t:'おなじ 時の中の 時間',      d:'分だけ かわる'},
  C2:{t:'午前どうしの 時間',         d:'時を またぐ'},
  C3:{t:'午前 → 午後の 時間',        d:'お昼の12時を こえる'},
  C4:{t:'午後 → つぎの日の 時間',    d:'夜中の0時を こえる'}
};
function courseOf(sid){ for(var i=0;i<COURSES.length;i++) if(COURSES[i].steps.indexOf(sid)>=0) return COURSES[i]; return COURSES[0]; }
var RANK = {'':0,'銅':1,'銀':2,'金':3};
function medalIcon(m){ return m==='金'?'🥇':m==='銀'?'🥈':m==='銅'?'🥉':''; }
function isOpen(sid){
  if(DB.set.unlock==='all') return true;
  var c = courseOf(sid), i = c.steps.indexOf(sid);
  return i===0 || !!DB.medals[c.steps[i-1]];
}
function titleFor(){
  var cleared=0, gold=0;
  ALL.forEach(function(s){ if(DB.medals[s]) cleared++; if(DB.medals[s]==='金') gold++; });
  if(cleared>=13 && gold>=13) return 'でんせつの とけいマスター';
  if(cleared>=13) return 'とけいマスター';
  if(cleared>=10) return 'とけい名人';
  if(cleared>=5)  return 'とけいたんてい';
  if(cleared>=1)  return 'とけい見習い';
  return 'とけいの たまご';
}
function nextStep(){
  for(var i=0;i<ALL.length;i++){ if(!DB.medals[ALL[i]] && isOpen(ALL[i])) return ALL[i]; }
  for(var j=0;j<ALL.length;j++){ if(DB.medals[ALL[j]]!=='金') return ALL[j]; }
  return 'A1';
}

/*==================== 画面の部品 ====================*/
var $ = function(id){ return document.getElementById(id); };
var CUR = 'home';
function show(name){
  ['home','play','clear','set'].forEach(function(n){ $('s-'+n).classList.toggle('on', n===name); });
  CUR = name; window.scrollTo(0,0); if(name!=='play'){ var f=$('fb'); if(f) f.textContent=''; }
}
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('on'); }, 2400); }
var modalKey = null;
function openModal(html, onKey){ $('mcard').innerHTML = html; $('modal').classList.add('on'); modalKey = onKey || null; }
function closeModal(){ $('modal').classList.remove('on'); $('mcard').innerHTML=''; modalKey = null; }
function isModal(){ return $('modal').classList.contains('on'); }
function ask(title, body, okLabel, okCls, onOk){
  okCls = okCls==='orange' ? '' : okCls;
  openModal('<h2>'+title+'</h2>'+(body?'<p>'+body+'</p>':'')
    +'<div class="row2"><button class="btn ghost" id="mNo">やめる</button><button class="btn '+(okCls||'')+'" id="mYes">'+okLabel+'</button></div>',
    function(e){ if(e.key==='Escape'){ closeModal(); } });
  $('mNo').onclick = closeModal;
  $('mYes').onclick = function(){ closeModal(); onOk(); };
  setTimeout(function(){ var b=$('mNo'); if(b) b.focus(); }, 30);
}
function pad2(n){ return (n<10?'0':'')+n; }

/*==================== 効果音（外部ファイルなし） ====================*/
var AC = null;
function tone(freqs, dur, type, vol){
  if(!DB.set.sound) return;
  try{
    if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state==='suspended') AC.resume();
    var t0 = AC.currentTime;
    freqs.forEach(function(f,i){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type = type||'sine'; o.frequency.value=f;
      var st=t0+i*dur*0.8;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(vol||0.18,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+dur+0.05);
    });
  }catch(e){}
}
var SFX = {
  good:function(){ tone([660,880],0.16,'triangle'); },
  miss:function(){ tone([330,294],0.18,'sine',0.12); },
  clear:function(){ tone([523,659,784,1047],0.18,'triangle'); },
  tick:function(){ tone([1200],0.03,'square',0.03); },
  tap:function(){ tone([520],0.05,'sine',0.06); }
};

/*==================== 見た目の設定を反映 ====================*/
function applyLook(){
  var h = document.documentElement;
  h.classList.remove('fs-s','fs-m','fs-l'); h.classList.add('fs-'+(DB.set.font||'m'));
  h.classList.toggle('rm', DB.set.motion==='less');
  paintFont();
}
var FS=['s','m','l'], FSL={s:'あ',m:'あ＋',l:'あ＋＋'};
function setFont(v){ DB.set.font=v; saveDB(); applyLook(); }
function paintFont(){
  document.querySelectorAll('.fsz [data-fs]').forEach(function(b){ var on=b.dataset.fs===(DB.set.font||'m'); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  var c=$('fsCycle'); if(c) c.textContent=FSL[DB.set.font||'m'];
}
function reduced(){
  if(DB.set.motion==='less') return true;
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

/*==================== ホーム ====================*/
var tabCourse = 'A';
function renderHome(){
  var cnt={金:0,銀:0,銅:0};
  ALL.forEach(function(s){ var m=DB.medals[s]; if(m) cnt[m]++; });
  $('status').innerHTML = '<span class="badge">'+titleFor()+'</span>'
    +'<span class="num">スコア '+DB.score+'</span>'
    +'<span class="medals" aria-label="メダル">🥇'+cnt['金']+' 🥈'+cnt['銀']+' 🥉'+cnt['銅']+'</span>';
  $('noStore').classList.toggle('hide', canStore);
  var r = DB.resume, hero = $('hero');
  if(r && r.queue && r.queue.length && INFO[r.step]){
    var done = r.total - r.queue.length;
    hero.innerHTML = '<div class="lbl">とちゅうから つづける</div><div class="ttl">'+INFO[r.step].t+'</div>'
      +'<div class="bar"><i style="width:'+Math.round(done/r.total*100)+'%"></i></div>'
      +'<div class="lbl">'+r.total+'問中 '+done+'問 できた（あと '+r.queue.length+'問）</div>'
      +'<button class="btn ok" id="heroGo">▶ つづきから</button>';
    $('heroGo').onclick = function(){ resumePlay(); };
  } else {
    var ns = nextStep(), m = DB.medals[ns];
    hero.innerHTML = '<div class="lbl">'+(m?'金メダルを ねらおう':'つぎの ステップ')+'</div><div class="ttl">'+INFO[ns].t+'</div>'
      +'<div class="lbl">'+INFO[ns].d+'</div>'
      +'<button class="btn" id="heroGo">▶ はじめる</button>';
    $('heroGo').onclick = function(){ tryStart(ns); };
  }
  var tb = $('tabs'); tb.innerHTML='';
  COURSES.forEach(function(c){
    var got = c.steps.filter(function(s){ return DB.medals[s]; }).length;
    var b = document.createElement('button');
    b.className = 'tab '+c.id+(tabCourse===c.id?' on':''); b.setAttribute('role','tab'); b.setAttribute('aria-selected', tabCourse===c.id);
    b.innerHTML = c.name+'<small>'+got+' / '+c.steps.length+'</small>';
    b.onclick = function(){ tabCourse=c.id; renderHome(); };
    tb.appendChild(b);
  });
  var tl = $('tiles'); tl.innerHTML='';
  var course = COURSES.filter(function(c){ return c.id===tabCourse; })[0];
  course.steps.forEach(function(s){
    var open = isOpen(s), m = DB.medals[s];
    var b = document.createElement('button');
    b.className = 'tile'+(m?' got':'')+(open?'':' lock')+(DB.resume && DB.resume.step===s?' now':'');
    b.innerHTML = '<span class="ic" aria-hidden="true">'+(m?medalIcon(m):(open?'⭐':'🔒'))+'</span><span class="t">'+INFO[s].t+'</span><span class="d">'+(open?INFO[s].d:'まえの ステップを クリアすると ひらくよ')+'</span>';
    b.setAttribute('aria-label', INFO[s].t+(m?'（'+m+'メダル）':'')+(open?'':'（まだ ひらいていない）'));
    b.onclick = function(){ if(!open){ toast('まえの ステップを クリアすると ひらくよ'); return; } tryStart(s); };
    tl.appendChild(b);
  });
}

/*==================== 問題をつくる ====================*/
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function m5(a,b){ var r=[]; for(var x=a;x<=b;x+=5) r.push(x); return r; }
function ap(abs){ var mm=((abs%1440)+1440)%1440, h=Math.floor(mm/60), mi=mm%60; var h12=h%12; if(h12===0) h12=12; return (h<12?'午前':'午後')+h12+'時'+pad2(mi)+'分'; }
function hm(h,m){ return h+'時'+pad2(m)+'分'; }

function makeProblem(sid){
  var h,m,sm,add,H,M,V,Y,a,sh,eh,em,sA,eA,dur,dH,dM;
  switch(sid){
  case 'A1':
    h=ri(1,12); m=pick(m5(0,55));
    return {mode:'read', sh:h, sm:m, q:'いま、何時何分かな？', fields:[['h','時'],['m','分']], ans:{h:h,m:m},
      hint:{lines:['みじかい はりは ◻ と つぎの 数の あいだ → ◻ 時','ながい はりは 5分ずつ かぞえて ◻ 分'], blanks:[h,h,m], text:hm(h,m)}};
  case 'A2':
    h=ri(1,11); sm=pick(m5(0,40)); add=pick(m5(5,55-sm));
    return {mode:'move', sh:h, sm:sm, th:h, tm:sm+add, q:hm(h,sm)+' の '+add+'分後 は？',
      hint:{lines:['分を たす：'+sm+' ＋ '+add+' ＝ ◻ 分','時は かわらないので ◻ 時'], blanks:[sm+add,h], text:hm(h,sm+add)}};
  case 'A3':
    h=ri(1,11); sm=pick(m5(10,55)); var rem=pick(m5(5,Math.max(5,sm-5))); add=(60-sm)+rem;
    return {mode:'move', sh:h, sm:sm, th:h+1, tm:rem, q:hm(h,sm)+' の '+add+'分後 は？',
      hint:{lines:[hm(h,sm)+' の ◻ 分後 が ちょうど '+(h+1)+'時','ぜんぶで '+add+'分 だから、のこりは ◻ 分','だから ◻ 時 ◻ 分'], blanks:[60-sm,rem,h+1,rem], text:hm(h+1,rem)}};
  case 'A4':
    H=ri(1,3); h=ri(1,12-H); sm=pick(m5(0,40)); M=pick(m5(5,55-sm));
    return {mode:'move', sh:h, sm:sm, th:h+H, tm:sm+M, q:hm(h,sm)+' の '+H+'時間'+M+'分後 は？',
      hint:{lines:['時を たす：'+h+' ＋ '+H+' ＝ ◻ 時','分を たす：'+sm+' ＋ '+M+' ＝ ◻ 分'], blanks:[h+H,sm+M], text:hm(h+H,sm+M)}};
  case 'A5':
    H=ri(1,2); h=ri(1,12-H-1); sm=pick(m5(35,55)); M=pick(m5(10,55));
    if(sm+M<60) M=60-sm+pick([0,5,10]); if(sm+M>=120) M=110-sm;
    var sumM=sm+M, rM=sumM-60;
    return {mode:'move', sh:h, sm:sm, th:h+H+1, tm:rM, q:hm(h,sm)+' の '+H+'時間'+M+'分後 は？',
      hint:{lines:['時を たす：'+h+' ＋ '+H+' ＝ ◻ 時','分を たす：'+sm+' ＋ '+M+' ＝ ◻ 分','60分で 1時間。'+sumM+'分 は 1時間と ◻ 分','時を 1つ ふやして ◻ 時 ◻ 分'], blanks:[h+H,sumM,rM,h+H+1,rM], text:hm(h+H+1,rM)}};
  case 'B1':
    var it=pick([{q:'1日 ＝ □ 時間',a:24,u:'時間'},{q:'1時間 ＝ □ 分',a:60,u:'分'},{q:'1分 ＝ □ びょう',a:60,u:'びょう'}]);
    return {mode:'num', q:it.q, ref:'1日＝24時間　1時間＝60分　1分＝60びょう', fields:[['a',it.u]], ans:{a:it.a},
      hint:{lines:['上の 青い わくを 見てみよう','こたえは ◻ '+it.u], blanks:[it.a], text:it.a+it.u}};
  case 'B2':
    if(Math.random()<0.5){ V=ri(2,9); a=V*60;
      return {mode:'num', q:V+'時間 ＝ □ 分', fields:[['a','分']], ans:{a:a},
        hint:{lines:['1時間は ◻ 分','60 × '+V+' ＝ ◻ 分'], blanks:[60,a], text:a+'分'}}; }
    V=ri(1,3); Y=pick(m5(5,55)); a=V*60+Y;
    return {mode:'num', q:V+'時間'+Y+'分 ＝ □ 分', fields:[['a','分']], ans:{a:a},
      hint:{lines:[V+'時間は ◻ 分',(V*60)+'分 ＋ '+Y+'分 ＝ ◻ 分'], blanks:[V*60,a], text:a+'分'}};
  case 'B3':
    if(Math.random()<0.5){ V=ri(70,200); while(V%60===0) V=ri(70,200); var hh=Math.floor(V/60), mm=V%60;
      return {mode:'num', q:V+'分 ＝ □時間 □分', fields:[['h','時間'],['m','分']], ans:{h:hh,m:mm},
        hint:{lines:['60分で 1時間',V+'分 の 中に 60分は ◻ こ','のこりは ◻ 分'], blanks:[hh,mm], text:hh+'時間'+mm+'分'}}; }
    V=ri(25,75); while(V%24===0) V=ri(25,75); var dd=Math.floor(V/24), h2=V%24;
    return {mode:'num', q:V+'時間 ＝ □日 □時間', fields:[['d','日'],['h','時間']], ans:{d:dd,h:h2},
      hint:{lines:['24時間で 1日',V+'時間 の 中に 24時間は ◻ こ','のこりは ◻ 時間'], blanks:[dd,h2], text:dd+'日'+h2+'時間'}};
  case 'B4':
    if(Math.random()<0.5){ V=ri(1,5); Y=pick(m5(5,55)); a=V*60+Y;
      return {mode:'num', q:V+'分'+Y+'びょう ＝ □ びょう', fields:[['a','びょう']], ans:{a:a},
        hint:{lines:['1分は 60びょう',V+'分は ◻ びょう',(V*60)+'びょう ＋ '+Y+'びょう ＝ ◻ びょう'], blanks:[V*60,a], text:a+'びょう'}}; }
    V=ri(70,300); while(V%60===0) V=ri(70,300); var mm2=Math.floor(V/60), ss=V%60;
    return {mode:'num', q:V+'びょう ＝ □分 □びょう', fields:[['m','分'],['s','びょう']], ans:{m:mm2,s:ss},
      hint:{lines:['60びょうで 1分',V+'びょう の 中に 60びょうは ◻ こ','のこりは ◻ びょう'], blanks:[mm2,ss], text:mm2+'分'+ss+'びょう'}};
  case 'C1':
    h=ri(8,11); sm=pick(m5(0,40)); em=pick(m5(sm+5,55)); sA=h*60+sm; eA=h*60+em;
    return {mode:'dur', sA:sA, eA:eA, q:ap(sA)+' から '+ap(eA)+' まで 何分？', fields:[['m','分']], ans:{m:em-sm},
      hint:{lines:['時は おなじ '+h+'時','おわりの分 '+em+' − はじめの分 '+sm+' ＝ ◻ 分'], blanks:[em-sm], text:(em-sm)+'分'}};
  case 'C2':
    sh=ri(7,9); H=ri(1,2); eh=sh+H; sm=pick(m5(5,40)); em=pick(m5(sm,55)); sA=sh*60+sm; eA=eh*60+em;
    return {mode:'dur', sA:sA, eA:eA, q:ap(sA)+' から '+ap(eA)+' まで 何時間何分？', fields:[['h','時間'],['m','分']], ans:{h:H,m:em-sm},
      hint:{lines:[hm(sh,sm)+' から '+hm(eh,sm)+' まで … ◻ 時間',hm(eh,sm)+' から '+hm(eh,em)+' まで … ◻ 分'], blanks:[H,em-sm], text:H+'時間'+(em-sm)+'分'}};
  case 'C3':
    sh=ri(10,11); sm=pick(m5(5,55)); eh=ri(13,15); em=pick(m5(5,55)); sA=sh*60+sm; eA=eh*60+em; dur=eA-sA; dH=Math.floor(dur/60); dM=dur%60;
    return {mode:'dur', sA:sA, eA:eA, q:ap(sA)+' から '+ap(eA)+' まで 何時間何分？', fields:[['h','時間'],['m','分']], ans:{h:dH,m:dM},
      hint:{lines:[ap(sA)+' から お昼の12時 まで … ◻ 分','12時 から 午後'+(eh-12)+'時 まで … ◻ 時間','午後'+(eh-12)+'時 から '+ap(eA)+' まで … ◻ 分','ぜんぶ あわせて（60分で 1時間）… ◻ 時間 ◻ 分'], blanks:[720-sA,eh-12,em,dH,dM], text:dH+'時間'+dM+'分'}};
  case 'C4':
    sh=ri(20,23); sm=pick(m5(5,55)); eh=ri(1,5); em=pick(m5(5,55)); sA=sh*60+sm; eA=(24+eh)*60+em; dur=eA-sA; dH=Math.floor(dur/60); dM=dur%60;
    var tm=1440-sA;
    return {mode:'dur', sA:sA, eA:eA, q:ap(sA)+' から つぎの日の '+ap(eA)+' まで 何時間何分？', fields:[['h','時間'],['m','分']], ans:{h:dH,m:dM},
      hint:{lines:[ap(sA)+' から 夜中の12時（午前0時）まで … ◻ 時間 ◻ 分','午前0時 から '+ap(eA)+' まで … ◻ 時間 ◻ 分','ぜんぶ あわせて（60分で 1時間）… ◻ 時間 ◻ 分'], blanks:[Math.floor(tm/60),tm%60,eh,em,dH,dM], text:dH+'時間'+dM+'分'}};
  }
  return {mode:'num', q:'1時間 ＝ □ 分', fields:[['a','分']], ans:{a:60}, hint:{lines:['1時間は ◻ 分'], blanks:[60], text:'60分'}};
}

/*==================== 時計（SVG） ====================*/
function clockSVG(id, cls){
  var s='<svg class="clock '+(cls||'')+'" id="'+id+'" viewBox="0 0 220 220" role="img" aria-label="とけい">';
  s+='<circle cx="110" cy="110" r="104" fill="#fff" stroke="#f9a25e" stroke-width="8"/>';
  for(var i=0;i<60;i++){
    var a=(i*6-90)*Math.PI/180, big=i%5===0, r1=big?88:93;
    s+='<line x1="'+(110+r1*Math.cos(a)).toFixed(1)+'" y1="'+(110+r1*Math.sin(a)).toFixed(1)+'" x2="'+(110+98*Math.cos(a)).toFixed(1)+'" y2="'+(110+98*Math.sin(a)).toFixed(1)+'" stroke="'+(big?'#5c5c70':'#c9c2b8')+'" stroke-width="'+(big?3:1.5)+'"/>';
  }
  for(var n=1;n<=12;n++){
    var b=(n*30-90)*Math.PI/180;

/* ---- 時計を動かす ---- */
function move(d){
  if(locked || hintOn) return;
  var t=((P.ch%12)*60+P.cm+d)%720; if(t<0) t+=720;
  P.ch=Math.floor(t/60); if(P.ch===0) P.ch=12; P.cm=t%60;
  refreshMove(); SFX.tick();
}
function refreshMove(){ setHands($('qClock'), P.ch, P.cm); var n=$('nowT'); if(n) n.innerHTML='いまの とけい <b>'+P.ch+'時'+pad2(P.cm)+'分</b>'; }
function submitMove(){ if(locked) return; judge(P.ch===P.th && P.cm===P.tm); }
function bindDrag(svg){
  var which=null;
  function ang(e){
    var r=svg.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
    var a=Math.atan2(y,x)*180/Math.PI+90; if(a<0) a+=360;
    return {a:a, d:Math.sqrt(x*x+y*y)/(r.width/2)};
  }
  svg.addEventListener('pointerdown', function(e){
    if(locked || hintOn) return;
    var p=ang(e); if(p.d>1.05) return;
    var hd=((P.ch%12)+P.cm/60)*30, md=P.cm*6;
    function diff(x,y){ var t=Math.abs(x-y)%360; return t>180?360-t:t; }
    // 中心に近いところ、または みじかい針の向きに近ければ 時の針
    which = (p.d<0.5 || (diff(p.a,hd)<diff(p.a,md) && p.d<0.75)) ? 'h' : 'm';
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault(); drag(e);
  });
  svg.addEventListener('pointermove', function(e){ if(which){ e.preventDefault(); drag(e); } });
  function end(){ which=null; }
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  function drag(e){
    var p=ang(e), oh=P.ch, om=P.cm;
    if(which==='m'){
      var nm=Math.round(p.a/6)%60, h=P.ch;
      if(om>=45 && nm<15) h=h%12+1;
      else if(om<15 && nm>=45) h=(h+10)%12+1;
      P.ch=h; P.cm=nm;
    } else {
      var hv=Math.round((p.a-P.cm*0.5)/30); hv=((hv%12)+12)%12; P.ch=hv===0?12:hv;
    }
    if(oh!==P.ch || om!==P.cm){ refreshMove(); SFX.tick(); }
  }
}
/* ---- 正誤 ---- */
function judge(ok){
  if(locked) return;
  if(ok){
    locked=true;
    S.combo++;
    var gain = 10 + Math.min((S.combo-1)*5,20) + (P.hinted?0:5);
    S.earned += gain; DB.score += gain;
    say('good','せいかい！ ＋'+gain+'点'+(S.combo>=2?'（'+S.combo+'れんぞく）':''));
    SFX.good(); glow();
    S.queue.shift(); DB.resume=S; saveDB();
    renderMeta();
    later(nextProblem, reduced()?600:900);
  } else {
    S.combo=0; S.mistakes++; P.wrong=(P.wrong||0)+1;
    SFX.miss(); DB.resume=S; saveDB(); renderMeta();
    var area=$('pArea'); area.classList.remove('shake'); void area.offsetWidth; if(!reduced()) area.classList.add('shake');
    if(P.wrong>=2 && DB.set.autoHint){
      say('miss','いっしょに 考えてみよう',3000);
      openHint();
    } else if(P.wrong>=2){
      // 考え方の自動案内を切っているときは、この問題を あとに まわす
      locked=true;
      say('miss','おしい！ この もんだいは あとで もう一回 出るよ');
      S.queue.push(S.queue.shift()); P.wrong=0; DB.resume=S; saveDB();
      later(nextProblem, 1300);

      var hb=$('hintBtn'); if(hb) hb.classList.add('pulse');
    }
  }
}

var HB = null; // {vals:[], ok:[], act:0}
function openHint(){
  if(locked) return;
  hintOn=true; S.hintUsed=true; P.hinted=true; DB.resume=S; saveDB();
  var h=P.hint, idx=0;
  var html='<div class="hintbox" id="hintBox"><h3>💡 こうやって 考えよう</h3>';
  h.lines.forEach(function(line){
    html+='<div class="hline">'+line.replace(/◻/g,function(){ return '<button class="blank" data-b="'+(idx++)+'" aria-label="あな '+idx+'"></button>'; })+'</div>';
  });
  html+='<div class="hmsg" id="hMsg" aria-live="polite">□を おして、数を いれてね</div><div class="keypad" id="hPad">';
  ['1','2','3','4','5','6','7','8','9','⌫','0','→'].forEach(function(k){ html+='<button class="key'+(k==='⌫'||k==='→'?' sm':'')+'" data-hk="'+k+'">'+(k==='→'?'つぎの □':k)+'</button>'; });
  html+='</div><button class="btn" id="hCheck">たしかめる</button>'
    +'<button class="btn ghost" id="hClose">じぶんで こたえる</button></div>';
  HB={vals:h.blanks.map(function(){return '';}), ok:h.blanks.map(function(){return false;}), act:0};
  var R=$('pR'); R.innerHTML=html;
  R.querySelectorAll('[data-b]').forEach(function(b){ b.onclick=function(){ if(!HB.ok[+b.dataset.b]) { HB.act=+b.dataset.b; paintHint(); } }; });
  R.querySelectorAll('[data-hk]').forEach(function(b){ b.onclick=function(){ hintKey(b.dataset.hk); }; });
  $('hCheck').onclick=checkHint;
  $('hClose').onclick=function(){ hintOn=false; renderProblem(); if(P.mode==='move') refreshMove(); paintFieldsSafe(); };
  paintHint();

function paintFieldsSafe(){ if(P.fields) paintFields(); }
function paintHint(){
  document.querySelectorAll('#hintBox [data-b]').forEach(function(b){
    var i=+b.dataset.b; b.textContent=HB.vals[i];
    b.classList.toggle('ok', HB.ok[i]); b.classList.toggle('active', !HB.ok[i] && i===HB.act);
  });
}
function hintKey(k){
  if(locked || HB.ok[HB.act]) { if(k!=='→') return; }
  if(k==='→'){ moveBlank(1); return; }
  if(k==='⌫') HB.vals[HB.act]=HB.vals[HB.act].slice(0,-1);
  else if(HB.vals[HB.act].length<3) HB.vals[HB.act]=(HB.vals[HB.act]==='0'?'':HB.vals[HB.act])+k;
  paintHint();
}
function moveBlank(dir){
  var n=HB.vals.length;
  for(var s=1;s<=n;s++){ var j=(HB.act+dir*s+n*2)%n; if(!HB.ok[j]){ HB.act=j; break; } }
  paintHint();
}
function checkHint(){
  if(locked) return;
  var bl=P.hint.blanks, all=true, firstNg=-1, empty=false;
  for(var i=0;i<bl.length;i++){
    if(HB.ok[i]) continue;
    if(HB.vals[i]===''){ empty=true; all=false; if(firstNg<0) firstNg=i; continue; }
    if(parseInt(HB.vals[i],10)===bl[i]) HB.ok[i]=true; else { all=false; if(firstNg<0) firstNg=i; }
  }
  if(firstNg>=0) HB.act=firstNg;
  paintHint();
  var msg=$('hMsg');
  if(all){
    SFX.good();
    msg.innerHTML='<div class="hans">こたえは '+P.hint.text+'</div>';
    $('hPad').classList.add('hide'); $('hClose').classList.add('hide');
    var c=$('hCheck'); c.textContent='この こたえで すすむ'; c.className='btn ok'; c.onclick=hintComplete; c.focus();
  } else if(empty && HB.ok.some(function(x){return x;})){
    msg.textContent='みどりの ところは できたよ。のこりの □も いれてみよう';
  } else if(empty){
    msg.textContent='□に 数を いれてから たしかめてね';
  } else {
    SFX.miss();
    msg.textContent='もう少し！ みどりに ならない □を 見なおそう';
  }
}
function hintComplete(){

    +'<li>メダル：金＝まちがいなし・考え方なし／銀＝まちがい3回まで／銅＝クリア。</li>'
    +'<li>ホーム画面に 追加すると、アプリのように ひらけます。</li></ol>'
    +'</div>'
    +'<button class="btn ok" id="setDone">ホームに もどる</button>'
    +'</div>';
  L.querySelectorAll('.seg').forEach(function(sg){
    var key=sg.dataset.key;
    sg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
      var v=b.dataset.v; if(v==='true') v=true; else if(v==='false') v=false; else if(/^\d+$/.test(v)) v=parseInt(v,10);
      DB.set[key]=v; saveDB(); applyLook(); renderSettings(); SFX.tap();
    }; });
  });
  $('wipe').onclick=function(){
    ask('記録を ぜんぶ 消しますか？','この たんまつの スコア・メダル・しょうごう・とちゅうの 問題が 消えます。もとに もどせません。','消す','dark', function(){
      DB.score=0; DB.medals={}; DB.best={}; DB.resume=null; DB.last=null; saveDB(); toast('記録を 消しました');
    });
  };
  $('setDone').onclick=leaveSettings;
}
function leaveSettings(){ renderHome(); show('home'); }

/*==================== 全画面 ====================*/
// iPad・Android・Chromebook はブラウザの全画面。iPhone は全画面のしくみが無いので「ホーム画面に追加」を案内する
var launchedStandalone = (function(){ try{ return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true; }catch(e){ return false; } })();
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function fsAble(){ var el=document.documentElement; return !!(el.requestFullscreen || el.webkitRequestFullscreen) && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
var isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function homeGuide(){
  var share='<svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-4px"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 11v9h14v-9" fill="none" stroke="#c2510c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  openModal('<h2>画面を 広く つかうには</h2><ol><li>ブラウザの 共有ボタン '+share+' を おす</li><li>「ホーム画面に追加」を えらぶ</li><li>ホーム画面に できた「とけいクエスト」から ひらく</li></ol><p style="font-size:.85rem;color:var(--sub)">ホーム画面から ひらくと、きろくは べつに なります。</p><button class="btn" id="mOk">わかった</button>',
    function(e){ if(e.key==='Escape'||e.key==='Enter'){ e.preventDefault(); closeModal(); } });
  $('mOk').onclick=closeModal;
}
function fsFail(){ if(isIOS) homeGuide(); else toast('この ブラウザでは 全画面に できませんでした'); }
function toggleFullscreen(){
  try{
    if(fsElement()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if(fsAble()){ var el=document.documentElement, r=(el.requestFullscreen || el.webkitRequestFullscreen).call(el); if(r && r.catch) r.catch(fsFail); }
    else if(isIOS) homeGuide();
    else toast('この ブラウザでは 全画面に できません');
  }catch(e){ fsFail(); }
}
function paintFs(){
  var on=!!fsElement();
  document.querySelectorAll('.fsBtn').forEach(function(b){
    b.classList.toggle('hide', launchedStandalone);
    b.setAttribute('aria-label', on?'全画面を やめる':'全画面');
    var p=b.querySelector('.fsIcon'); if(p) p.setAttribute('d', on?'M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5':'M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5');
  });
}
document.addEventListener('fullscreenchange', paintFs);
document.addEventListener('webkitfullscreenchange', paintFs);

/*==================== キーボード ====================*/
document.addEventListener('keydown', function(e){
  if(isModal()){ if(modalKey) modalKey(e); return; }
  var tag = e.target && e.target.tagName;
  if(CUR!=='play' || !P) return;
  if((e.key==='Enter'||e.key===' ') && tag==='BUTTON') return; // ボタンに合わせているときは そのボタンが動く
  if(hintOn){
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); hintKey(e.key); }
    else if(e.key==='Backspace'){ e.preventDefault(); hintKey('⌫'); }
    else if(e.key==='Tab' || e.key==='ArrowRight'){ e.preventDefault(); moveBlank(e.shiftKey?-1:1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); moveBlank(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); var c=$('hCheck'); if(c) c.click(); }
    return;
  }
  if(P.mode==='move'){
    var d=0;
    if(e.key==='ArrowUp') d=e.shiftKey?60:5; else if(e.key==='ArrowDown') d=e.shiftKey?-60:-5;
    else if(e.key==='ArrowRight') d=1; else if(e.key==='ArrowLeft') d=-1;
    else if(e.key==='PageUp') d=60; else if(e.key==='PageDown') d=-60;
    if(d){ e.preventDefault(); move(d); return; }
    if(e.key==='Enter'){ e.preventDefault(); submitMove(); }
    return;
  }
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); keyIn(e.key); }
  else if(e.key==='Backspace'){ e.preventDefault(); keyIn('⌫'); }
  else if(e.key==='Tab' || e.key==='ArrowRight'){ if(P.fields.length>1){ e.preventDefault(); nextField(e.shiftKey?-1:1); } }
  else if(e.key==='ArrowLeft'){ if(P.fields.length>1){ e.preventDefault(); nextField(-1); } }
  else if(e.key==='Enter'){ e.preventDefault(); submitNum(); }
});

/*==================== はじまり ====================*/
$('setBtn').onclick = openSettings;
if(DB._cleaned){ delete DB._cleaned; saveDB(); }
$('setBack').onclick = leaveSettings;
$('playBack').onclick = function(){ GEN++; if(S && !S.queue.length && !S.finished){ finishStep(); return; } if(S){ DB.resume = S.queue.length ? S : null; saveDB(); } renderHome(); show('home'); };
$('modal').addEventListener('click', function(e){ if(e.target===$('modal') && $('mcard').querySelector('#mNo')) closeModal(); });
window.addEventListener('pagehide', saveDB);
applyLook();
if(DB.last) tabCourse = courseOf(DB.last).id;
if(DB.resume && DB.resume.step) tabCourse = courseOf(DB.resume.step).id;
renderHome(); show('home');
document.querySelectorAll('.fsBtn').forEach(function(b){ b.onclick=toggleFullscreen; });
document.querySelectorAll('.fsz [data-fs]').forEach(function(b){ b.onclick=function(){ setFont(b.dataset.fs); }; });
$('fsCycle').onclick=function(){ setFont(FS[(FS.indexOf(DB.set.font||'m')+1)%3]); toast('文字の 大きさ：'+FSL[DB.set.font]); };
paintFs(); paintFont();
// ボタンを おしたら 小さな 音（手ごたえ）
document.addEventListener('pointerdown', function(e){ var b=e.target.closest && e.target.closest('.btn,.key,.tab,.tile,.ibtn,.seg button,.fsz button,.field,.blank'); if(b && !b.disabled) SFX.tap(); }, true);
// はじめの画面：初回は2.6秒、2回目からは1.5秒。タップ・キーで すぐ進む
(function(){
  var sp=$('splash'); if(!sp) return;
  var seen=false; try{ seen=localStorage.getItem('tokeiQuest.seen')==='1'; localStorage.setItem('tokeiQuest.seen','1'); }catch(e){}
  var ms=seen?1500:2600, gone=false;
  sp.style.setProperty('--sd', (ms/1000)+'s');
  function go(){ if(gone) return; gone=true; document.removeEventListener('keydown', key, true); sp.classList.add('out'); setTimeout(function(){ sp.remove(); var h=$('heroGo'); if(h && !isModal()) try{ h.focus({preventScroll:true}); }catch(e){} }, reduced()?0:460); }
  function key(e){ e.preventDefault(); e.stopPropagation(); go(); }
  sp.addEventListener('click', go);
  document.addEventListener('keydown', key, true);
  setTimeout(go, ms);
})();
window.__tq = { fs:toggleFullscreen, db:function(){ return DB; }, cur:function(){ return P; }, state:function(){ return S; }, make:makeProblem };
})();
</script>
